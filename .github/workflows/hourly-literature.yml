name: Brief littéraire manuel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Générer le brief
        run: python scripts/generate_brief.py

      - name: Archiver les briefs du cycle
        uses: actions/upload-artifact@v4
        with:
          name: brief-litteraire-${{ github.run_number }}
          path: briefs/
          retention-days: 7
