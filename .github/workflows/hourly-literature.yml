name: Brief littéraire horaire

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer le brief
        run: python scripts/generate_brief.py

      - name: Enregistrer le brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add briefs/
          if git diff --cached --quiet; then
            echo "Aucun nouveau brief à enregistrer."
            exit 0
          fi
          git commit -m "Ajouter le brief littéraire horaire"
          git push

      - name: Archiver les briefs du cycle
        uses: actions/upload-artifact@v4
        with:
          name: brief-litteraire-${{ github.run_number }}
          path: briefs/
          retention-days: 30
