name: Production PDF manuelle

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  produire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Générer le brief éditorial
        run: |
          mkdir -p briefs output/pages output/pdfs
          python generate_brief.py

      - name: Vérifier les pages illustrées
        id: pages
        shell: bash
        run: |
          count=$(find output/pages -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' \) | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "Aucune page illustrée disponible. La génération d’images doit être connectée avant l’assemblage PDF."
          fi

      - name: Construire le PDF
        if: steps.pages.outputs.count != '0'
        run: |
          stamp=$(date -u +'%Y%m%d_%H%M')
          pdf="output/pdfs/Regards_au_Levant_${stamp}.pdf"
          python scripts/build_pdf.py --images-dir output/pages --output "$pdf"
          echo "PDF_PATH=$pdf" >> "$GITHUB_ENV"

      # SECURITY HOLD: Never inject Google service-account credentials into a
      # workflow that executes repository-controlled code. The manual artifact
      # stays available; re-enable Drive transfer only with short-lived OIDC
      # and an isolated, reviewed uploader.

      - name: Archiver le PDF comme artifact GitHub
        if: steps.pages.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: regards-au-levant-pdf
          path: ${{ env.PDF_PATH }}
          retention-days: 7

      # Saving briefs by pushing from this job is intentionally disabled.
      # Retained artifacts can be reviewed and committed from a trusted workstation.
